# Degree heterogeneity at order 1/k. Hypothesis from paperA_structure_gpu and the heterogeneous mean field
# (degree-weighted neighbour sampling, field lam (k_i/<k>) r^(p+1)): the Erdos-Renyi fold coefficient equals the
# random-regular coefficient plus a_het(p) (about -0.4 at p = 1, -0.25 at p = 2), which matched at k = 24 but not
# at k = 12. If the law is additive at leading order the agreement must improve with k: k = 24, 48, 96 with the
# neighbourhood overlap k^2/N <= 0.05, bisection tolerance 0.05%.
id: paperA_hetero_gpu
experiment: fold_grid
root_seed: 20261031
graphs:
  - {kind: rec, rho: 1.0, label: rho1.00}
  - {kind: er, label: er}
k: [24, 48, 96]
n: {24: 12000, 48: 46080, 96: 184320}
p: [1.0, 2.0]
n_seeds: 10
dt: 0.02
t_relax: 480
frac: 0.55
rel_tol: 0.0005
workers: 10
backend: gpu
