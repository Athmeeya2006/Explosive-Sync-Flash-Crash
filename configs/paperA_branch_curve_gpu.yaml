# Branch shift c(lam) = k (R - R0) along the synchronised branch (docs/PROGRESS.md, "Next" item 1): five
# couplings, both exponents, directed (no back-reaction) and undirected (rho = 1) graphs, 10 seeds, with the
# neighbourhood overlap k^2/N <= 0.05. Predictions for the same (p, mult): paperA_branch_theory.
id: paperA_branch_curve_gpu
experiment: branch_grid
root_seed: 20261025
graphs:
  - {kind: dir, label: dir}
  - {kind: rec, rho: 1.0, label: rho1.00}
k: [12, 24, 48]
n: {12: 20000, 24: 20000, 48: 50000}
p: [1.0, 2.0]
mult: [1.1, 1.25, 1.5, 2.0, 3.0]
n_seeds: 10
dt: 0.02
t_burn: 150
t_measure: 250
workers: 10
backend: gpu
