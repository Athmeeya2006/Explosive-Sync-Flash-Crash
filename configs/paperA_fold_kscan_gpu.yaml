# Fold against connectivity up to k = 96, directed and undirected, with the neighbourhood overlap held at
# k^2/N <= 0.05 and the bisection tolerance tightened to 0.05% (the predicted shift at k = 96 is about 0.6%
# directed and 1.7% undirected at p = 1, so 0.2% was too coarse). The trend k (ratio - 1) against 1/k
# extrapolates the leading coefficient a(p) for comparison with docs/THEORY.md.
id: paperA_fold_kscan_gpu
experiment: fold_grid
root_seed: 20261026
graphs:
  - {kind: dir, label: dir}
  - {kind: rec, rho: 1.0, label: rho1.00}
k: [16, 24, 32, 48, 64, 96]
n: {16: 10000, 24: 12000, 32: 20480, 48: 46080, 64: 81920, 96: 184320}
p: [1.0, 2.0]
n_seeds: 10
dt: 0.02
t_relax: 480
frac: 0.55
rel_tol: 0.0005
workers: 20
backend: gpu
