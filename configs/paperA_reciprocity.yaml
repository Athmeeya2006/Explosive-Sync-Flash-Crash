# Reciprocity interpolation. Every node listens to k others; a fraction rho of those links is mutual.
# rho = 0 is a directed graph, rho = 1 a random regular undirected graph. The theory predicts a branch
# shift linear in rho: c(rho) = c_dynamic + rho * c_reaction. The Rician closure predicts no dependence
# on rho at all. N is chosen per k so that the neighbourhood overlap k^2/N stays below 0.05.
id: paperA_reciprocity
experiment: branch_grid
root_seed: 20261015
graphs:
  - {kind: rec, rho: 0.0, label: rho0.00}
  - {kind: rec, rho: 0.25, label: rho0.25}
  - {kind: rec, rho: 0.5, label: rho0.50}
  - {kind: rec, rho: 0.75, label: rho0.75}
  - {kind: rec, rho: 1.0, label: rho1.00}
k: [24, 48]
n: {24: 20000, 48: 50000}
p: [1.0]
mult: [1.25]
n_seeds: 10
dt: 0.02
t_burn: 150
t_measure: 250
workers: 12
