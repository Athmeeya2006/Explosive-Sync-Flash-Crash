name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"   # nightly: full suite including slow tests

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src/esfc
      - name: Tests (fast) with coverage of src/esfc
        if: github.event_name != 'schedule'
        run: pytest -m "not slow" --cov=esfc --cov-report=term-missing
      - name: Tests (all) with coverage of src/esfc
        if: github.event_name == 'schedule'
        run: pytest --cov=esfc --cov-report=term-missing

  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Legacy tests (retired K/d_i layer, kept runnable)
        run: |
          pip install numpy scipy matplotlib tqdm pytest pytest-cov
          cd legacy && python -m pytest python/tests -q
